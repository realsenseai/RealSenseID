plugins {
    alias(libs.plugins.android.library)
}

android {
    compileSdk 35

    defaultConfig {
        minSdk 25
        targetSdk 35

        externalNativeBuild.cmake {
                cppFlags += [
                    '-frtti',
                    '-fexceptions',
                    '-D__ANDROID__',
                    '-O3',
                    '-flto',
                    '-fomit-frame-pointer',
                    '-ffunction-sections',  // linker to remove unused code for smaller binary
                    '-fdata-sections'
                ]
                arguments += [
                    '-DRSID_TOOLS=OFF',
                    '-DCMAKE_VERBOSE_MAKEFILE=ON',
                    '-DRSID_PREVIEW=ON',
                    '-DRSID_PIPELINE=ON',
                    '-DANDROID_ARM_NEON=ON',
                    '-DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF',
                    '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                    '-DANDROID_CPP_FEATURES=rtti exceptions',
                    '-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON', // CMake's to enable LTO
                    '-Wno-dev']
        }

        ndk.abiFilters = ['arm64-v8a', 'x86_64']
    }

    namespace 'com.realsenseai.rsid'

    aaptOptions {
        noCompress 'onnx' // Keep model uncompressed so AAsset_getBuffer can mmap it
    }

    sourceSets {
        main {
            assets.srcDirs += ["${project.projectDir}/../../../models"]
        }
    }

    flavorDimensions "default"
    productFlavors {
        standard {
            dimension "default"
            externalNativeBuild.cmake {
                arguments += ["-DRSID_SECURE=OFF", "-DCMAKE_BUILD_TYPE=Release"]
            }
        }
        // Phase out secured flavor
        // secured {
        //    dimension "default"
        //    externalNativeBuild.cmake {
        //        arguments += ["-DRSID_SECURE=ON", "-DRSID_TOOLS=OFF"]
        //    }
        //}
    }

    externalNativeBuild {
        cmake {
            path = "../../../CMakeLists.txt"
            version "3.20.0+"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            resValue "string", "app_version", "${defaultConfig.versionName}"
        }

        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            resValue "string", "app_version", "${defaultConfig.versionName}"
        }
    }
    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.all { output ->
            def libName = "RealSenseID"
            def buildType = variant.buildType.name
            def newName = "${libName}_${buildType}.aar"
            outputFileName = newName
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}

project.afterEvaluate {
    // Allows CMake/SWIG to run before Android Studio complains about missing generated files
    javaPreCompileStandardDebug.dependsOn externalNativeBuildStandardDebug
    javaPreCompileStandardRelease.dependsOn externalNativeBuildStandardRelease
    // Phase out secured flavor
    // javaPreCompileSecuredDebug.dependsOn externalNativeBuildSecuredDebug
    // javaPreCompileSecuredRelease.dependsOn externalNativeBuildSecuredRelease
}